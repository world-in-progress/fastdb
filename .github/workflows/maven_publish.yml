name: Publish fastdb-java to Maven Central

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Artifacts run ID from main
        required: true
        type: string
      source_sha:
        description: Exact 40-character tested source SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fastdb-publish-maven
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'world-in-progress/fastdb' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RELEASE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require complete proof and artifact runs for the exact source
        run: >-
          python3 tests/ci/publish_release.py check-ci
          --run-id "$RELEASE_RUN_ID" --source-sha "$RELEASE_SOURCE_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: portable-release-${{ inputs.source_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify candidate hashes and prepare the Maven deployment
        id: prepare
        run: >-
          python3 tests/ci/publish_release.py prepare
          --directory release --output stage --ecosystem maven
          --run-id "$RELEASE_RUN_ID" --source-sha "$RELEASE_SOURCE_SHA"
      - name: Sign and upload the verified Maven artifacts
        if: steps.prepare.outputs.pending == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: python3 tests/ci/publish_release.py publish-maven --stage stage
      - name: Verify registry bytes and retain publication receipt
        run: python3 tests/ci/publish_release.py verify-registry --stage stage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maven-publication-${{ inputs.source_sha }}
          path: |
            stage/publish-plan.json
            stage/published.json
          if-no-files-found: warn
