name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish verified archives or verify the OIDC exchange only
        required: true
        type: choice
        default: publish
        options:
          - publish
          - verify-oidc
      candidate_run_id:
        description: Required for publish; successful Release Artifacts run ID from main
        required: false
        type: string
      source_sha:
        description: Required for publish; exact 40-character tested source SHA
        required: false
        type: string

permissions: {}

concurrency:
  group: fastdb-publish-crates
  cancel-in-progress: false

jobs:
  verify_oidc:
    if: ${{ inputs.operation == 'verify-oidc' && github.repository == 'world-in-progress/fastdb' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Authenticate to crates.io with GitHub OIDC
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Verify token exchange without publishing
        env:
          CRATES_IO_OIDC_TOKEN: ${{ steps.crates_auth.outputs.token }}
        shell: bash
        run: |
          if [[ -z "$CRATES_IO_OIDC_TOKEN" ]]; then
            echo "::error::crates.io OIDC exchange did not return a token"
            exit 1
          fi
          {
            echo 'crates.io OIDC token exchange succeeded.'
            echo 'No package publication was invoked.'
            echo 'Job success also requires the authentication action token-revocation post-step to succeed.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.operation == 'publish' && github.repository == 'world-in-progress/fastdb' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require complete proof and artifact runs for the exact source
        run: >-
          python3 tests/ci/publish_release.py check-ci
          --run-id "$RELEASE_RUN_ID" --source-sha "$RELEASE_SOURCE_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: portable-release-${{ inputs.source_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify hashes and prepare only missing registry artifacts
        id: prepare
        run: >-
          python3 tests/ci/publish_release.py prepare
          --directory release --output stage --ecosystem crates
          --run-id "$RELEASE_RUN_ID" --source-sha "$RELEASE_SOURCE_SHA"
      - name: Authenticate to crates.io with GitHub OIDC
        id: crates_auth
        if: steps.prepare.outputs.pending == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Upload tested Rust archives in dependency order
        if: steps.prepare.outputs.pending == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: python3 tests/ci/publish_release.py publish-crates --stage stage
      - name: Verify registry bytes and retain publication receipt
        run: python3 tests/ci/publish_release.py verify-registry --stage stage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crates-publication-${{ inputs.source_sha }}
          path: |
            stage/publish-plan.json
            stage/published.json
          if-no-files-found: warn
