name: Publish Rust crates

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Artifacts run ID from main
        required: true
        type: string
      source_sha:
        description: Exact 40-character tested source SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fastdb-publish-crates
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'world-in-progress/fastdb' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require complete proof and artifact runs for the exact source
        run: >-
          python3 tests/ci/publish_release.py check-ci
          --run-id "$RELEASE_RUN_ID" --source-sha "$RELEASE_SOURCE_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: portable-release-${{ inputs.source_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify hashes and prepare only missing registry artifacts
        id: prepare
        run: >-
          python3 tests/ci/publish_release.py prepare
          --directory release --output stage --ecosystem crates
          --run-id "$RELEASE_RUN_ID" --source-sha "$RELEASE_SOURCE_SHA"
      - name: Upload tested Rust archives in dependency order
        if: steps.prepare.outputs.pending == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 tests/ci/publish_release.py publish-crates --stage stage
      - name: Verify registry bytes and retain publication receipt
        run: python3 tests/ci/publish_release.py verify-registry --stage stage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crates-publication-${{ inputs.source_sha }}
          path: |
            stage/publish-plan.json
            stage/published.json
          if-no-files-found: warn
