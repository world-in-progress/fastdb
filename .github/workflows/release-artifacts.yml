name: Release Artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ github.event_name == 'push' && steps.filter.outputs.packages == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'fastcarto/**'
              - 'schemas/**'
              - 'python/**'
              - 'bindings/rust/**'
              - 'bindings/java/**'
              - 'ts/**'
              - 'tests/cpp/**'
              - 'tests/abi/**'
              - 'tests/fuzz/**'
              - 'tests/python/payload/**'
              - 'tests/rust/**'
              - 'tests/ts/**'
              - 'tests/golden/**'
              - 'pyproject.toml'
              - 'setup.py'
              - 'MANIFEST.in'
              - 'package.json'
              - 'package-lock.json'
              - 'LICENSE'
              - 'THIRD_PARTY_NOTICES.txt'
              - 'tools/vendor_portable_payload_deps.sh'
              - 'tools/generate_embedded_payload_schemas.py'
              - 'tools/generate_third_party_notices.py'
      - name: Verify coherent release versions and release tooling
        run: |
          python3 tests/ci/release_artifacts.py version
          python3 tests/ci/test_release_artifacts.py
          python3 tests/ci/test_publish_release.py
          python3 tests/ci/test_python_distributions.py
          python3 tests/ci/test_python_release_reuse.py
          python3 tests/ci/test_ci_build_scope.py
          python3 -m pip install setuptools
          python3 tests/ci/test_windows_python_build.py
          python3 tests/ci/test_check_payload_abi_symbols.py

  native:
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            part: core-linux
          - os: macos-15
            target: aarch64-apple-darwin
            part: core-macos
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            part: core-windows
            msvc_arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            part: core-windows-arm64
            msvc_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up the native MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Require native Windows and Rust architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.msvc_arch == 'arm64' && 'ARM64' || 'AMD64' }}
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne $env:EXPECTED_ARCH) { throw "Unexpected Windows runner architecture" }
          if ((rustc -vV) -notcontains "host: $env:RELEASE_TARGET") { throw "Rust must run natively for $env:RELEASE_TARGET" }
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
      - name: Install Ninja for the single-config MSVC build
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install ninja
      - name: Build and test native release Core
        if: runner.os != 'Windows'
        run: |
          python3 tests/ci/release_artifacts.py start-native --build-dir build/release
          cmake -S fastcarto -B build/release \
            -DBUILD_TESTING=ON -DBUILD_TOOLS=OFF \
            -DUSE_SWIG_PYTHON=OFF -DUSE_SWIG_NODE=OFF -DUSE_SWIG_GO=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure
          python3 tools/check_payload_abi_symbols.py --build-dir build/release
          cargo test --manifest-path bindings/rust/Cargo.toml --workspace --all-features
      - name: Build and test native release Core (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests/ci/release_artifacts.py start-native --build-dir build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S fastcarto -B build/release -G Ninja -DBUILD_TESTING=ON -DBUILD_TOOLS=OFF -DUSE_SWIG_PYTHON=OFF -DUSE_SWIG_NODE=OFF -DUSE_SWIG_GO=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Collect independent compiler failures in one run; Ninja still
          # returns nonzero when any target fails, checked immediately below.
          cmake --build build/release --parallel 2 -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Shared-library test executables live outside the DLL directory.
          $fastdbDll = @(Get-ChildItem build/release -Filter fastdb.dll -File -Recurse)
          if ($fastdbDll.Count -ne 1) { throw "Expected exactly one built fastdb.dll" }
          $env:PATH = "$($fastdbDll[0].DirectoryName);$env:PATH"
          ctest --test-dir build/release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_payload_abi_symbols.py --build-dir build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path bindings/rust/Cargo.toml --workspace --all-features
      - name: Verify and retain isolated Rust packages
        if: runner.os != 'Windows'
        run: >-
          python3 tests/ci/check_rust_payload_package.py
          --build-dir build/release --package-dir build/release-crates
      - name: Verify and retain isolated Rust packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tests/ci/check_rust_payload_package.py
          --build-dir build/release --package-dir build/release-crates
      - name: Package Core and exact Rust archives
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PART: ${{ matrix.part }}
        run: |
          python3 tests/ci/release_artifacts.py core \
            --build-dir build/release --output dist --target "$RELEASE_TARGET"
          if [ "$RELEASE_PART" = core-linux ]; then
            cp build/release-crates/*.crate dist/
          fi
          python3 tests/ci/release_artifacts.py record \
            --output dist --part "$RELEASE_PART" --target "$RELEASE_TARGET"
      - name: Package Core archive (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PART: ${{ matrix.part }}
        run: |
          python tests/ci/release_artifacts.py core --build-dir build/release --output dist --target "$env:RELEASE_TARGET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/ci/release_artifacts.py record --output dist --part "$env:RELEASE_PART" --target "$env:RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-part-${{ matrix.part }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-logs-${{ matrix.part }}
          path: build/release/Testing/Temporary/

  python:
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    uses: ./.github/workflows/python-distributions.yml
    with:
      source_sha: ${{ github.sha }}

  typescript:
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Emscripten 5.0.2
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.2
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.2
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build, test, and install the exact TypeScript tarball
        run: |
          npm ci --prefix ts/fastdb4ts
          bash ts/build-wasm.sh
          npm run test:ts
          mkdir -p dist
          npm pack ./ts/fastdb4ts --pack-destination dist
          python3 tests/ci/check_ts_payload_package.py --package-dir dist
          python3 tests/ci/release_artifacts.py record --output dist --part typescript
      - uses: actions/upload-artifact@v7
        with:
          name: release-part-typescript
          path: dist/
          if-no-files-found: error

  java_native:
    needs: metadata
    if: needs.metadata.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x86_64, arch: x86_64, lib_name: libfastdb_java.so }
          - { os: macos-15, platform: macos-arm64, arch: arm64, lib_name: libfastdb_java.dylib }
          - { os: windows-2022, platform: windows-x86_64, arch: AMD64, lib_name: fastdb_java.dll }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: python -m pip install ninja
      - name: Build and locate the native Java library
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          LIB_NAME: ${{ matrix.lib_name }}
        run: |
          cmake_args=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            test "$PROCESSOR_ARCHITECTURE" = "$EXPECTED_ARCH"
            cmake_args+=(-G Ninja)
          else
            test "$(uname -m)" = "$EXPECTED_ARCH"
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
            cmake_args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          cmake -S fastcarto -B build/java "${cmake_args[@]}" \
            -DFASTDB_BUILD_JAVA_JNI=ON -DBUILD_TESTING=OFF -DBUILD_TOOLS=OFF \
            -DUSE_SWIG_PYTHON=OFF -DUSE_SWIG_NODE=OFF -DUSE_SWIG_GO=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/java --target fastdb_java --parallel 2
          library="$(find build/java -type f -name "$LIB_NAME")"
          if [[ ! -s "$library" ]]; then
            echo "Expected exactly one nonempty $LIB_NAME"
            exit 1
          fi
          mkdir -p build/java-native
          cp "$library" "build/java-native/$LIB_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: java-native-${{ matrix.platform }}
          path: build/java-native/${{ matrix.lib_name }}
          if-no-files-found: error

  java:
    needs: [metadata, java_native]
    if: needs.metadata.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - uses: actions/download-artifact@v8
        with:
          name: java-native-linux-x86_64
          path: build/java-resources/META-INF/native/linux-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: java-native-macos-arm64
          path: build/java-resources/META-INF/native/macos-arm64
      - uses: actions/download-artifact@v8
        with:
          name: java-native-windows-x86_64
          path: build/java-resources/META-INF/native/windows-x86_64
      - name: Package and smoke-test the self-loading Java release
        run: |
          version="$(python3 tests/ci/release_artifacts.py version)"
          cp LICENSE THIRD_PARTY_NOTICES.txt build/java-resources/META-INF/
          mvn -f bindings/java/pom.xml -B package source:jar-no-fork javadoc:jar -DskipTests \
            -Dfastdb.java.nativeResourcesDir="$PWD/build/java-resources"
          package="bindings/java/target/fastdb-java-$version"
          env -u FASTDB_JAVA_LIBRARY_PATH -u JAVA_TOOL_OPTIONS -u JDK_JAVA_OPTIONS -u _JAVA_OPTIONS \
            java -Xcheck:jni -Djava.library.path= --class-path "$package.jar" \
            bindings/java/src/test/release/JavaReleaseSmoke.java
          mkdir -p dist
          cp "$package.jar" "$package-sources.jar" "$package-javadoc.jar" dist/
          cp bindings/java/pom.xml "dist/fastdb-java-$version.pom"
          python3 tests/ci/release_artifacts.py record --output dist --part java
      - uses: actions/upload-artifact@v7
        with:
          name: release-part-java
          path: dist/
          if-no-files-found: error

  java_smoke:
    needs: [metadata, java]
    if: needs.metadata.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          - { os: macos-15 }
          - { os: windows-2022 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v8
        with:
          name: release-part-java
          path: dist
      - name: Smoke-test the final Java release JAR on each supported OS
        shell: bash
        run: |
          jars=()
          for candidate in dist/fastdb-java-*.jar; do
            case "$candidate" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            if [[ -f "$candidate" ]]; then
              jars+=("$candidate")
            fi
          done
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one main Java release JAR, found ${#jars[@]}"
            exit 1
          fi
          env -u FASTDB_JAVA_LIBRARY_PATH -u JAVA_TOOL_OPTIONS -u JDK_JAVA_OPTIONS -u _JAVA_OPTIONS \
            java -Xcheck:jni -Djava.library.path= --class-path "${jars[0]}" \
            bindings/java/src/test/release/JavaReleaseSmoke.java

  candidate:
    needs: [metadata, native, python, typescript, java, java_smoke]
    if: needs.metadata.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-part-*
          path: release-parts
      - name: Assemble the complete source-bound release manifest
        run: >-
          python3 tests/ci/release_artifacts.py assemble
          --input release-parts --output release
      - uses: actions/upload-artifact@v7
        with:
          name: portable-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
