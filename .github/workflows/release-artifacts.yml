name: Release Artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Verify coherent release versions and release tooling
        run: |
          python3 tests/ci/release_artifacts.py version
          python3 tests/ci/test_release_artifacts.py
          python3 tests/ci/test_publish_release.py
          python3 tests/ci/test_python_distributions.py
          python3 tests/ci/test_check_payload_abi_symbols.py

  native:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            part: core-linux
          - os: macos-15
            target: aarch64-apple-darwin
            part: core-macos
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            part: core-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up MSVC x64 developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja for the single-config MSVC build
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install ninja
      - name: Build and test native release Core
        if: runner.os != 'Windows'
        run: |
          python3 tests/ci/release_artifacts.py start-native --build-dir build/release
          cmake -S fastcarto -B build/release \
            -DBUILD_TESTING=ON -DBUILD_TOOLS=OFF \
            -DUSE_SWIG_PYTHON=OFF -DUSE_SWIG_NODE=OFF -DUSE_SWIG_GO=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure
          python3 tools/check_payload_abi_symbols.py --build-dir build/release
          cargo test --manifest-path bindings/rust/Cargo.toml --workspace --all-features
      - name: Build and test native release Core (Windows MSVC x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tests/ci/release_artifacts.py start-native --build-dir build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S fastcarto -B build/release -G Ninja -DBUILD_TESTING=ON -DBUILD_TOOLS=OFF -DUSE_SWIG_PYTHON=OFF -DUSE_SWIG_NODE=OFF -DUSE_SWIG_GO=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Collect independent compiler failures in one run; Ninja still
          # returns nonzero when any target fails, checked immediately below.
          cmake --build build/release --parallel 2 -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Shared-library test executables live outside the DLL directory.
          $fastdbDll = @(Get-ChildItem build/release -Filter fastdb.dll -File -Recurse)
          if ($fastdbDll.Count -ne 1) { throw "Expected exactly one built fastdb.dll" }
          $env:PATH = "$($fastdbDll[0].DirectoryName);$env:PATH"
          ctest --test-dir build/release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_payload_abi_symbols.py --build-dir build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path bindings/rust/Cargo.toml --workspace --all-features
      - name: Verify and retain isolated Rust packages
        if: runner.os != 'Windows'
        run: >-
          python3 tests/ci/check_rust_payload_package.py
          --build-dir build/release --package-dir build/release-crates
      - name: Verify and retain isolated Rust packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python tests/ci/check_rust_payload_package.py
          --build-dir build/release --package-dir build/release-crates
      - name: Package Core and exact Rust archives
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PART: ${{ matrix.part }}
        run: |
          python3 tests/ci/release_artifacts.py core \
            --build-dir build/release --output dist --target "$RELEASE_TARGET"
          if [ "$RELEASE_PART" = core-linux ]; then
            cp build/release-crates/*.crate dist/
          fi
          python3 tests/ci/release_artifacts.py record \
            --output dist --part "$RELEASE_PART" --target "$RELEASE_TARGET"
      - name: Package Core archive (Windows MSVC x64)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_PART: ${{ matrix.part }}
        run: |
          python tests/ci/release_artifacts.py core --build-dir build/release --output dist --target "$env:RELEASE_TARGET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/ci/release_artifacts.py record --output dist --part "$env:RELEASE_PART" --target "$env:RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-part-${{ matrix.part }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-logs-${{ matrix.part }}
          path: build/release/Testing/Temporary/

  python:
    needs: metadata
    uses: ./.github/workflows/python-distributions.yml
    with:
      source_sha: ${{ github.sha }}

  typescript:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Emscripten 5.0.2
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.2
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.2
          echo "$RUNNER_TEMP/emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build, test, and install the exact TypeScript tarball
        run: |
          npm ci --prefix ts/fastdb4ts
          bash ts/build-wasm.sh
          npm run test:ts
          mkdir -p dist
          npm pack ./ts/fastdb4ts --pack-destination dist
          python3 tests/ci/check_ts_payload_package.py --package-dir dist
          python3 tests/ci/release_artifacts.py record --output dist --part typescript
      - uses: actions/upload-artifact@v7
        with:
          name: release-part-typescript
          path: dist/
          if-no-files-found: error

  candidate:
    needs: [native, python, typescript]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-part-*
          path: release-parts
      - name: Assemble the complete source-bound release manifest
        run: >-
          python3 tests/ci/release_artifacts.py assemble
          --input release-parts --output release
      - uses: actions/upload-artifact@v7
        with:
          name: portable-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
