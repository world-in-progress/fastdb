name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          # Extract version using python for reliability
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "py/v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "Tag py/v${{ steps.get_version.outputs.VERSION }} already exists. Skipping build and publish."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag py/v${{ steps.get_version.outputs.VERSION }} does not exist. Proceeding."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build_wheels:
    needs: check_version
    if: needs.check_version.outputs.exists == 'false'
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          # MacOS: Build for x86_64 and arm64 (Apple Silicon)
          CIBW_ARCHS_MACOS: x86_64 arm64
          # Linux: Build for x86_64 and aarch64 (ARM64), skip 32-bit (i686)
          CIBW_ARCHS_LINUX: x86_64 aarch64
          # Windows: Build only for AMD64 (64-bit), skip 32-bit (x86) to avoid build issues
          CIBW_ARCHS_WINDOWS: AMD64
          # Skip PyPy and musllinux
          CIBW_SKIP: pp* *musllinux*
          CIBW_FREE_THREADED_SUPPORT: true
          # Ensure cmake is available in the build environment
          CIBW_BEFORE_ALL_LINUX: "yum install -y cmake || apt-get install -y cmake || apk add cmake"

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: check_version
    if: needs.check_version.outputs.exists == 'false'
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish:
    needs: [check_version, build_wheels, build_sdist]
    if: needs.check_version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "py/v${{ needs.check_version.outputs.version }}" -m "Release py/v${{ needs.check_version.outputs.version }}"
          git push origin "py/v${{ needs.check_version.outputs.version }}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
