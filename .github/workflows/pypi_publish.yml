name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      operation:
        description: Publish tested CI files, or build only missing wheels for an existing release
        required: true
        type: choice
        options: [backfill, publish]
        default: backfill
      tag:
        description: Existing version tag; backfills must remain within PyPI's upload window
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fastdb-publish-pypi
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.repository == 'world-in-progress/fastdb' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      operation: ${{ inputs.operation || 'publish' }}
      artifact_run_id: ${{ steps.proof.outputs.artifact_run_id }}
      python_artifact_id: ${{ steps.proof.outputs.python_artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve an existing version tag on main
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python tests/ci/python_distributions.py resolve --tag "$RELEASE_TAG"
      - name: Require complete CI evidence for the tag's exact source
        id: proof
        env:
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          OPERATION: ${{ inputs.operation || 'publish' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [ "$OPERATION" = publish ]; then extra+=(--require-artifact); fi
          python tests/ci/python_distributions.py check-ci \
            --source-sha "$RELEASE_SOURCE_SHA" "${extra[@]}"

  distributions:
    needs: source
    if: needs.source.outputs.operation == 'backfill'
    uses: ./.github/workflows/python-distributions.yml
    with:
      source_sha: ${{ needs.source.outputs.source_sha }}
      backfill: true

  prepare:
    needs: [source, distributions]
    if: >-
      always() && needs.source.result == 'success' &&
      (needs.source.outputs.operation == 'publish' ||
       (needs.distributions.result == 'success' && needs.distributions.outputs.pending == 'true'))
    runs-on: ubuntu-24.04
    outputs:
      pending: ${{ steps.stage.outputs.pending }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        if: needs.source.outputs.operation == 'publish'
        with:
          artifact-ids: ${{ needs.source.outputs.python_artifact_id }}
          run-id: ${{ needs.source.outputs.artifact_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        if: needs.source.outputs.operation == 'backfill'
        with:
          name: release-part-python
          path: dist
      - name: Recheck the complete inventory, then select upload files
        id: stage
        env:
          BACKFILL: ${{ needs.source.outputs.operation == 'backfill' }}
        run: |
          extra=()
          if [ "$BACKFILL" = true ]; then extra+=(--backfill); fi
          python release-tools/tests/ci/python_distributions.py stage \
            --directory dist --source source --output upload "${extra[@]}"
      - uses: actions/upload-artifact@v7
        if: steps.stage.outputs.pending == 'true'
        with:
          name: pypi-upload
          path: upload/
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.pending == 'true'
    runs-on: ubuntu-24.04
    # Preserve this workflow filename and the publisher's environment identity.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-upload
          path: dist
      - name: Publish through the existing PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
          # Backfills build a tag using a newer controller; do not attest that
          # the controller's main SHA is the package's source revision.
          attestations: ${{ github.event_name != 'workflow_dispatch' }}
          print-hash: true
