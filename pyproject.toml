[project]
name = "fastdb4py"
version = "0.2.0"
description = "FastCarto database bindings"
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.scripts]
fdb = "fastdb4py.cli:main"

[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "numpy",
    "cmake>=3.16",
    "swig>=4.4"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyarrow>=23.0.1",
    "pytest>=9.0.1",
    "setuptools>=77",
]

[tool.pyright]
pythonPlatform = "All"
extraPaths = ["python"]
typeCheckingMode = "off"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py", "tests_*.py", "*_test.py"]
